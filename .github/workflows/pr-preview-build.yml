name: PR Preview - Build

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-build.yml@v3
    with:
      node-version: '20'
      php-version: '7.4'
      artifacts: insert-special-characters=preview-artifacts/insert-special-characters.zip
      build-command: |
        set -euo pipefail
        test "$(git rev-parse --show-toplevel)" = "$PWD"
        test ! -e preview-artifacts
        npm ci --no-optional --no-audit --no-fund
        npm run build
        stage="$(mktemp -d "${RUNNER_TEMP:?}/insert-special-characters-preview.XXXXXX")"
        cleanup() {
          rm -rf -- "$stage"
        }
        trap cleanup EXIT
        mkdir preview-artifacts "$stage/insert-special-characters"
        rsync -rc --exclude-from=.distignore --exclude=/preview-artifacts ./ "$stage/insert-special-characters/"
        python3 - "$stage/insert-special-characters" preview-artifacts/insert-special-characters.zip "$(git rev-parse HEAD)" <<'PY'
        import hashlib
        import re
        import stat
        import sys
        import unicodedata
        import zipfile
        from pathlib import Path

        source_root = Path(sys.argv[1]).resolve(strict=True)
        zip_path = Path(sys.argv[2]).resolve()
        head = sys.argv[3]
        slug = "insert-special-characters"
        if not re.fullmatch(r"[0-9a-f]{40}", head):
            raise SystemExit("HEAD is not a lowercase 40-character Git SHA")

        def validate_name(name):
            if not name.startswith(f"{slug}/") or name.startswith("/") or "\\" in name:
                raise SystemExit(f"unsafe archive path: {name!r}")
            if len(name.encode("utf-8")) > 1024 or unicodedata.normalize("NFC", name) != name:
                raise SystemExit(f"unsupported archive path: {name!r}")
            parts = name.rstrip("/").split("/")
            if any(part in ("", ".", "..") or any(ord(character) < 32 or ord(character) == 127 for character in part) for part in parts):
                raise SystemExit(f"ambiguous archive path: {name!r}")

        entries = [(f"{slug}/", source_root, True)]
        for path in sorted(source_root.rglob("*"), key=lambda item: item.relative_to(source_root).as_posix()):
            relative = path.relative_to(source_root).as_posix()
            name = f"{slug}/{relative}"
            mode = path.lstat().st_mode
            if stat.S_ISLNK(mode) or not (stat.S_ISDIR(mode) or stat.S_ISREG(mode)):
                raise SystemExit(f"release staging contains an unsupported type: {name!r}")
            entries.append((name + ("/" if path.is_dir() else ""), path, path.is_dir()))

        if not 1 <= len(entries) <= 2048:
            raise SystemExit("release staging exceeds its entry-count bound")
        seen = {}
        file_names = set()
        expanded = 0
        for name, path, is_directory in entries:
            validate_name(name)
            normalized = unicodedata.normalize("NFC", name.rstrip("/"))
            key = normalized.casefold()
            if key in seen:
                raise SystemExit(f"colliding release path: {name!r}")
            seen[key] = name
            parent = normalized.rpartition("/")[0]
            while parent:
                if parent.casefold() in file_names:
                    raise SystemExit(f"file-prefix collision in release staging: {name!r}")
                parent = parent.rpartition("/")[0]
            if not is_directory:
                file_names.add(key)
                size = path.stat().st_size
                if not 0 <= size <= 8 * 1024 * 1024:
                    raise SystemExit(f"release entry exceeds its size bound: {name!r}")
                expanded += size
                if expanded > 16 * 1024 * 1024:
                    raise SystemExit("release staging exceeds its expanded-size bound")

        required = {
            f"{slug}/build/admin.asset.php",
            f"{slug}/build/admin.js",
            f"{slug}/build/index.asset.php",
            f"{slug}/build/index.css",
            f"{slug}/build/index.js",
            f"{slug}/build/index-rtl.css",
            f"{slug}/build/style-index.css",
            f"{slug}/build/style-index-rtl.css",
            f"{slug}/inc/plugin.php",
            f"{slug}/insert-special-characters.php",
            f"{slug}/readme.txt",
        }
        if not required.issubset(set(seen.values())):
            raise SystemExit("release staging is missing required runtime files")
        forbidden_prefixes = (f"{slug}/.git/", f"{slug}/.github/", f"{slug}/.wordpress-org/", f"{slug}/assets/", f"{slug}/bin/", f"{slug}/node_modules/", f"{slug}/preview-artifacts/", f"{slug}/src/", f"{slug}/tests/", f"{slug}/vendor/")
        forbidden_files = {f"{slug}/.distignore", f"{slug}/.DS_Store", f"{slug}/.eslintignore", f"{slug}/.eslintrc.js", f"{slug}/.gitignore", f"{slug}/.nvmrc", f"{slug}/.wordpress-version-checker.json", f"{slug}/.wp-env.json", f"{slug}/.wp-env.override.json", f"{slug}/CHANGELOG.md", f"{slug}/CODE_OF_CONDUCT.md", f"{slug}/composer.json", f"{slug}/composer.lock", f"{slug}/CONTRIBUTING.md", f"{slug}/CREDITS.md", f"{slug}/LICENSE.md", f"{slug}/package-lock.json", f"{slug}/package.json", f"{slug}/phpcs.xml", f"{slug}/README.md", f"{slug}/webpack.config.js", f"{slug}/wpacceptance.json"}
        if any(name.startswith(forbidden_prefixes) or name in forbidden_files for name in seen.values()):
            raise SystemExit("release staging contains a development-only path excluded by .distignore")

        with zipfile.ZipFile(zip_path, "x", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
            archive.comment = head.encode("ascii")
            for name, path, is_directory in entries:
                info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                info.create_system = 3
                info.compress_type = zipfile.ZIP_DEFLATED
                if is_directory:
                    info.external_attr = (stat.S_IFDIR | 0o755) << 16 | 0x10
                    archive.writestr(info, b"")
                else:
                    executable = bool(path.stat().st_mode & 0o111)
                    info.external_attr = (stat.S_IFREG | (0o755 if executable else 0o644)) << 16
                    archive.writestr(info, path.read_bytes())

        if not 0 < zip_path.stat().st_size <= 8 * 1024 * 1024:
            raise SystemExit("preview ZIP exceeds its archive-size bound")
        with zipfile.ZipFile(zip_path) as archive:
            if archive.comment != head.encode("ascii"):
                raise SystemExit("preview ZIP is not bound to the checked-out Git SHA")
            infos = archive.infolist()
            if len(infos) != len(entries):
                raise SystemExit("preview ZIP entry count differs from release staging")
            archive_names = set()
            total_read = 0
            for info, (expected_name, source, is_directory) in zip(infos, entries):
                validate_name(info.filename)
                if info.filename != expected_name or info.filename in archive_names:
                    raise SystemExit(f"preview ZIP path differs from release staging: {info.filename!r}")
                archive_names.add(info.filename)
                if info.flag_bits & 1 or info.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED):
                    raise SystemExit(f"preview ZIP entry has unsupported encoding: {info.filename!r}")
                if info.file_size > 8 * 1024 * 1024 or total_read + info.file_size > 16 * 1024 * 1024:
                    raise SystemExit(f"preview ZIP entry exceeds its declared bounds: {info.filename!r}")
                if is_directory:
                    if not info.is_dir() or info.file_size != 0:
                        raise SystemExit(f"preview ZIP directory differs from release staging: {info.filename!r}")
                else:
                    data = archive.read(info)
                    total_read += len(data)
                    if info.is_dir() or len(data) != info.file_size or hashlib.sha256(data).digest() != hashlib.sha256(source.read_bytes()).digest():
                        raise SystemExit(f"preview ZIP bytes differ from release staging: {info.filename!r}")
            bad_entry = archive.testzip()
            if bad_entry is not None:
                raise SystemExit(f"preview ZIP CRC failed: {bad_entry!r}")
        print(f"Validated {slug} preview ZIP: {len(entries)} entries, {expanded} expanded bytes, {zip_path.stat().st_size} archive bytes")
        PY
